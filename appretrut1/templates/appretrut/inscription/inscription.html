{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte | Appretruct</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl-NTUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'appretrut/inscription.css' %}">
</head>

<body>

<header class="container-fluid page-header">
    <div class="brand">APPRETRUCT</div>
    <p class="text-white">Rejoignez APPRETRUCT dès aujourd’hui</p>
</header>

<div class="page-shell">

    <main class="signup-card">

        <section class="welcome-area">
            <h1>Créer un compte</h1>
        </section>

        <section class="form-area">

            {% if form.errors %}
                <div class="alert alert-danger">
                    <strong>Erreur dans le formulaire :</strong>
                    {{ form.errors }}
                </div>
            {% endif %}

            <form id="inscriptionForm"
                  method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="field">
                        <label for="nom2">Nom</label>

                        <input
                            id="nom2"
                            name="nom"
                            type="text"
                            placeholder="Votre nom"
                            required>
                    </div>

                    <div class="field">
                        <label for="prenom2">Prénom</label>

                        <input
                            id="prenom2"
                            name="prenom"
                            type="text"
                            placeholder="Votre prénom"
                            required>
                    </div>

                    <div class="field full">
                        <label for="date-naissance2">
                            Date de naissance
                        </label>

                        <input
                            id="date-naissance2"
                            name="date_naissance"
                            type="date"
                            required>
                    </div>

                    <div class="field full">
                        <label for="email2">
                            Adresse e-mail
                        </label>

                        <input
                            id="email2"
                            name="email"
                            type="email"
                            placeholder="exemple@email.com"
                            required>
                    </div>

                    <div class="mb-3">
    <label for="ville">Ville</label>
    <input type="text"
           name="ville"
           id="ville"
           class="form-control"
           required>
</div>

                    <div class="field full">
                        <label for="telephone2">
                            Téléphone
                        </label>

                        <input
                            id="telephone2"
                            name="telephone"
                            type="tel"
                            placeholder="Votre numéro"
                            required>
                    </div>

                    <div class="form-section-title full">
                        Profil et sécurité
                    </div>

                    <div class="field full">
                        <label for="password2">
                            Mot de passe
                        </label>

                        <input
                            id="password2"
                            name="motdepasse"
                            type="password"
                            placeholder="••••••••"
                            required>
                    </div>

                    <div class="field full">
                        <label for="confirm2">
                            Confirmer le mot de passe
                        </label>

                        <input
                            id="confirm2"
                            name="confirmation"
                            type="password"
                            placeholder="••••••••"
                            required>
                    </div>

                </div>

                <button
                    class="btn-submit"
                    type="submit">
                    CRÉER MON COMPTE
                </button>

            </form>

            <p class="login-link">
                Déjà inscrit ?

                <a href="{% url 'connexion' %}">
                    Se connecter
                </a>
            </p>

        </section>

    </main>

</div>

</body>
</html>
