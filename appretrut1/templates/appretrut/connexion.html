{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <title>Connexion | Appretruct</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="{% static 'appretrut/connection.css' %}" />
</head>

<body>

<header class="fixed-top">

    <div class="container-fluid">

        <nav class="navbar navbar-expand-lg navbar-light head">

            <div class="container-fluid long">

                <a class="navbar-brand app text-white" href="#">
                    appretruct
                </a>

                

            </div>

        </nav>

    </div>

</header>


<div class="page1">

    <main class="dedans">

        <section class="welcome">

            <h1>Bon retour !</h1>

            <p>
                Connectez-vous à votre espace APPRETRUCT
            </p>

        </section>


        <section class="form-area">

            <h2>Connexion</h2>

            <form id="connexionForm">

                <label for="email">
                    Adresse e-mail
                </label>

                <div class="input-box">

                    <input id="email" type="email" placeholder="exemple@email.com" required />

                </div>


                <label for="password">
                    Mot de passe
                </label>

                <div class="input-box password-box">

                    <input id="password" type="password" placeholder="••••••••" required />

                </div>


                <div class="row-actions">

                    <a href="#" class="a1">
                        Mot de passe oublié ?
                    </a>

                </div>


            

                <button
                    class="btn-submit"   
                    type="submit">

                    SE CONNECTER

                </button>

            </form>


            <p class="create-account">

                Vous n'avez pas de compte ?

                <a
                    href="{% url 'inscription' %}"
                    class="a1">

                    Créer un compte

                </a>

            </p>

        </section>

    </main>


    <footer class="page-footer">

        <div class="text-center p-4 text-white">

            © 2026 Copyright:

            <a
                class="text-reset fw-bold"
                href="mailto:princejared@gmail.com">

                jared

            </a>

            Tout Droit Reserver

        </div>

    </footer>

</div>



<script src="{% static 'appretrut/js/jsconnect.js' %}"></script>

</body>
</html>
