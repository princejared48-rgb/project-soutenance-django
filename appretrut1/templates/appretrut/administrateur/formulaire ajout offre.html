<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/formajoutoff.css">
</head>
<body>
    <header class="fixed-top">
        <div class="container-fluid">
            <nav class="navbar navbar-expand-lg navbar-light head">
                <div class="container-fluid long">
                    <a class="navbar-brand app text-white" href="acceuil - Copie.html">appretruct</a>
                    <div class="hum">
                        <button class="navbar-toggler bth1 btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                        <div class="collapse navbar-collapse dev d-flex ju" id="navbarSupportedContent">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item"><a class="nav-link lien li1 text-white" href="acceuil - Copie.html">accueil</a></li>
                                <li class="nav-item"><a class="nav-link lien li1 text-white" href="offre.html">offre d'emploi</a></li>
                                <li class="nav-item"><a class="nav-link lien li1 text-white" href="entreprise.html">entreprise</a></li>
                                <li class="nav-item"><a class="nav-link lien li1 text-white" href="candidature.html">Candidature</a></li>
                                <li class="nav-item"><a class="nav-link lien li1 text-white" href="contact.html">contact</a></li>
                            </ul>
                        </div>
                        <div><a class="nav-link lien li12 text-white" href="offre.html">Retour aux offres</a></div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="offre-page">
        <div class="offre-card">
            <div class="offre-head">
                <h1>Ajouter une offre</h1>
                <p>Utilisez ce formulaire pour publier une nouvelle offre avec les mêmes champs que votre page actuelle.</p>
            </div>
            <form class="offre-form" action="#" method="post">
                <label for="entreprise">entreprise</label>
                <input type="text" id="entreprise" name="entreprise" placeholder="Nom de l'entreprise" required>

                <label for="poste">poste</label>
                <input type="text" id="poste" name="poste" placeholder="Intitulé du poste" required>

                <label for="domaine">domaine</label>
                <select id="domaine" name="domaine" placeholder="Domaine ou secteur" required>
                    <option value="Informatique & Digital">Informatique & Digital</option>
                    <option value="Santé & Médical">Santé & Médical</option>
                    <option value="Industrie & Génie Technique">Industrie & Génie Technique</option>
                    <option value="BTP & Construction">BTP & Construction</option>
                    <option value="Finance, Banque & Comptabilité">Finance, Banque & Comptabilité</option>
                    <option value="Administration & Ressources Humaines">Administration & Ressources Humaines</option>
                    <option value="Commerce & Relation Client">Commerce & Relation Client</option>
                    <option value="Marketing & Communication">Marketing & Communication</option>
                    <option value="Transport & Logistique">Transport & Logistique</option>
                    <option value="Éducation & Formation">Éducation & Formation</option>
                    <option value="Agriculture & Agro-industrie">Agriculture & Agro-industrie</option>
                    <option value="Hôtellerie & Tourisme">Hôtellerie & Tourisme</option>
                    <option value="Droit & Sécurité">Droit & Sécurité</option>
                    <option value="Art, Design & Création">Art, Design & Création</option>
                    </select>

                <label for="description">description</label>
              <textarea name="" class="areatext" id="description"></textarea>

                <label for="salaire">salaire</label>
                <input type="number" id="salaire" name="salaire" placeholder="Salaire proposé" min="0">

                <label for="contract">contract</label>
                <select id="contract" name="contract" required>
                    <option value="CDI">CDI</option>
                    <option value="CDD">CDD</option>
                    <option value="Stage">Stage</option>
                    <option value="Alternance">Alternance</option>
                    <option value="Intérim">Intérim</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Consultant">Consultant</option>
                    <option value="Temps plein">Temps plein</option>
                    <option value="Temps partiel">Temps partiel</option>
                    <option value="Contrat saisonnie">Contrat saisonnie</option>
                    <option value="contrat saisonnier">contrat saisonnier</option>
                    <option value="télétravail">télétravail</option>
                    <option value="Hybrid">Hybrid</option>
                    <option value="Contrat de prestatio">Contrat de prestatio</option>
                </select>

                <button type="button" class="submit" onclick="recup()">Valider</button>
            </form>
        </div>
    </main>

    <script src="scripts/creation.js"></script>
</body>
</html>
