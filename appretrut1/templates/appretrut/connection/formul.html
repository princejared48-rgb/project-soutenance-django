<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion et inscription | Appretruct</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;background:#0f1115;
}

.container{
    width:950px;
height:550px;
position:relative;
overflow:hidden;
border-radius:12px;
    background:#1e2229;border:1px solid rgba(212,216,77,0.3);
    box-shadow:0 0 5px rgba(212,216,77,0.2),
               0 0 20px rgba(212,216,77,0.1),
               0 0 60px rgba(212,216,77,0.1),
               0 0 100px rgba(0,0,0,0.8),
               20px 20px 80px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
}

.container:hover{
    transform: rotateY(2deg) rotateX(1deg);
}

#switch{display:none;
}
.overlay{
    position:absolute;top:0;left:50%;width:50%;height:100%;
    clip-path:polygon(18% 0%,100% 0%,100% 100%,0% 100%);
    background:linear-gradient(135deg,#d4d84d 0%,#a6a32a 100%);
    z-index:10;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:50px;color:#1a1d23;
    transition:all 0.8s cubic-bezier(0.7,-0.4,0.3,1.4);
}

.overlay-light{
    content:"";
position:absolute;
top:-50%;
left:-150%;
width:50%;
height:200%;
    background: linear-gradient(120deg, rgba(255,255,255,0), rgba(255,255,255,0.3), rgba(255,255,255,0));
    transform: skewX(-20deg);
    filter: blur(12px);transition:left 1.4s ease-in-out;
}

#switch:checked ~ .overlay{
    transform:translateX(-100%);
    clip-path:polygon(0 0,82% 0,100% 100%,0% 100%);
}

#switch:checked ~ .overlay .overlay-light{
    left:150%;
}

.overlay-content h1{font-family:'Times New Roman', Times, serif;font-size:2.4rem;
margin-bottom:20px;
text-shadow:0 2px 10px rgba(0,0,0,0.2);
animation:floatText 2s ease-in-out infinite alternate;
}
.overlay-content p{
opacity:0.9;
}

.back-msg{
display:none;opacity:0;
}
#switch:checked ~ .overlay .join-msg{
display:none;
}
#switch:checked ~ .overlay .back-msg{
display:block;animation:slideIn 0.8s forwards;
}

.forms-wrapper{
position:absolute;
width:100%;
height:100%;
display:flex;
}

.form-box{
width:50%;
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
transition:0.6s ease;
}

.signup-form{
opacity:0;
transform:translateX(50px);
pointer-events:none;}
#switch:checked ~ .forms-wrapper .login-form{
opacity:0;
transform:translateX(-50px);
pointer-events:none;}
#switch:checked ~ .forms-wrapper .signup-form{
opacity:1;
transform:translateX(0);
pointer-events:auto;}

h2{
color:#fff;
font-family:'Times New Roman', Times, serif;
margin-bottom:30px;
letter-spacing:1px;}

.input-box{
position:relative;
margin-bottom:25px;
border-bottom:2px solid rgba(255,255,255,0.1);}
.input-box input{
width:100%;
padding:12px 35px;
background:none;
border:none;
color:#fff;
outline:none;
transition:0.3s;}
.input-box i{
position:absolute;
left:5px;
top:15px;
color:#d4d84d;
transition:0.3s;}
.input-box input:focus{
border-bottom:2px solid #d4d84d;}
.input-box input:focus + i{
color:#fff;
text-shadow:0 0 10px #d4d84d;}

.btn-main{
background:#d4d84d;
border:none;
padding:15px;
border-radius:30px;
font-weight:700;
color:#1a1d23;
cursor:pointer;
text-transform:uppercase;
letter-spacing:2px;
margin-top:20px;
box-shadow:0 10px 20px rgba(212,216,77,0.3);
transition:0.3s;}
.btn-main:hover{
transform:scale(1.05);
box-shadow:0 15px 30px rgba(212,216,77,0.5);}

.switch-btn{
background:rgba(26,29,35,0.1);
border:2px solid #1a1d23;
padding:12px 35px;
margin-top:30px;
display:inline-block;
border-radius:30px;
cursor:pointer;
font-weight:700;
transition:0.3s;}
.switch-btn:hover{
background:#1a1d23;color:#d4d84d;
}

@keyframes slideIn{
from{opacity:0;
transform:scale(0.8);}to{opacity:1;transform:scale(1);}
}
@keyframes floatText{0%{transform:translateY(0);}100%{transform:translateY(-5px);}}

@media(max-width:768px){
    .container{width:95%;height:auto;}
    .forms-wrapper{flex-direction:column;}
    .form-box{width:100%;padding:40px;}
    .overlay{width:100%;left:0;clip-path:none;padding:30px;}
    .overlay-light{display:none;}
}

</style>

</head>
<body>

<div class="container">
    <input type="checkbox" id="switch">

    <!-- Overlay avec diagonale -->
    <div class="overlay">
        <div class="overlay-light"></div>
        <div class="overlay-content join-msg">
            <h1>WELCOME BACK!</h1>
            <p>Login with your credentials to explore more.</p>
            <label for="switch" class="switch-btn">CREATE ACCOUNT</label>
        </div>
        <div class="overlay-content back-msg">
            <h1>JOIN US!</h1>
            <p>Start your journey by creating a free account.</p>
            <label for="switch" class="switch-btn">GO TO LOGIN</label>
        </div>
    </div>

    <!-- Formulaires -->
    <div class="forms-wrapper">
        <div class="form-box login-form">
            <h2>LOGIN</h2>
            <div class="input-box"><i class="fa fa-user"></i><input type="text" placeholder="Username"></div>
            <div class="input-box"><i class="fa fa-lock"></i><input type="password" placeholder="Password"></div>
            <button class="btn-main">LOGIN</button>
        </div>

        <div class="form-box signup-form">
            <h2>SIGN UP</h2>
            <div class="input-box"><i class="fa fa-user"></i><input type="text" placeholder="Full Name"></div>
            <div class="input-box"><i class="fa fa-envelope"></i><input type="email" placeholder="Email Address"></div>
            <div class="input-box"><i class="fa fa-lock"></i><input type="password" placeholder="Password"></div>
            <button class="btn-main">REGISTER</button>
        </div>
    </div>
</div>

</body>
</html>
